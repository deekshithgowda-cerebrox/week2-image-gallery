<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Image Gallery</h1>
        <p>Explore my collection of images</p>
    </header>

    <main>

        <section class="gallery" aria-label="Image Gallery">

            <img src="images/img1.jpg" alt="Gallery image 1">
            <img src="images/img2.jpg" alt="Gallery image 2">
            <img src="images/img3.jpg" alt="Gallery image 3">
            <img src="images/img4.jpg" alt="Gallery image 4">
            <img src="images/img5.jpg" alt="Gallery image 5">
            <img src="images/img6.jpg" alt="Gallery image 6">
            <img src="images/img7.jpg" alt="Gallery image 7">

        </section>

    </main>

    <div class="lightbox" id="lightbox">

        <button type="button" class="close" id="close" aria-label="Close image">
            &times;
        </button>

        <img id="lightbox-image" src="" alt="">

    </div>

    <script src="script.js"></script>

</body>

</html>
